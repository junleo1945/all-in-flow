# 在 GitHub 上构建镜像并推送到 GHCR（ghcr.io/<owner>/...），测试服务器只需拉取。
# 同时把 postgres 镜像同步到 GHCR，部署时服务器不再访问 Docker Hub。
# 仅当 PR 合并到 main 时触发；直接 push 到 main 不会触发。手动重建可用 workflow_dispatch。
name: docker-images

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 同一时间只跑一个构建，避免两次合并同时覆盖 latest 标签
concurrency:
  group: docker-images-main
  cancel-in-progress: false

jobs:
  build:
    # 只有真正合并（merged）的 PR 才构建；关闭未合并的 PR 直接跳过
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
      # 合并后 main 上的提交 SHA；手动触发时退回到当前 ref 的 SHA
      IMAGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送服务端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/all-in-flow-server:latest
            ${{ env.IMAGE_PREFIX }}/all-in-flow-server:${{ env.IMAGE_SHA }}
          cache-from: type=gha,scope=server
          # 缓存导出偶发 "failed to reserve cache"，不应中断镜像构建与推送
          cache-to: type=gha,mode=max,scope=server,ignore-error=true

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/all-in-flow-web:latest
            ${{ env.IMAGE_PREFIX }}/all-in-flow-web:${{ env.IMAGE_SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true

      - name: 同步 postgres 镜像到 GHCR
        run: |
          docker pull postgres:16-alpine
          docker tag postgres:16-alpine "$IMAGE_PREFIX/postgres:16-alpine"
          docker push "$IMAGE_PREFIX/postgres:16-alpine"
