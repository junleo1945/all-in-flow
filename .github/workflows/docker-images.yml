# 在 GitHub 上构建镜像并推送到 GHCR（ghcr.io/<owner>/...），测试服务器只需拉取。
# 同时把 postgres 镜像同步到 GHCR，部署时服务器不再访问 Docker Hub。
name: docker-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送服务端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/all-in-flow-server:latest
            ${{ env.IMAGE_PREFIX }}/all-in-flow-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/all-in-flow-web:latest
            ${{ env.IMAGE_PREFIX }}/all-in-flow-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 同步 postgres 镜像到 GHCR
        run: |
          docker pull postgres:16-alpine
          docker tag postgres:16-alpine "$IMAGE_PREFIX/postgres:16-alpine"
          docker push "$IMAGE_PREFIX/postgres:16-alpine"
